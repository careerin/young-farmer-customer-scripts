<!DOCTYPE html>
<html lang="ko">
<head>

<title>청년 농업인 기본 고객응대 스크립트</title>
<style>
:root{--navy:#153258;--navy2:#274f7e;--ink:#1e2938;--muted:#64748b;--line:#d9e1ea;--bg:#f3f7fb;--paper:#fff;--yellow:#fee500;--yellowSoft:#fff8cc;--green:#11663d;--greenSoft:#e8f6ed;--warn:#8b4b00;--warnSoft:#fff4df;--shadow:0 8px 22px rgba(24,47,76,.10)}
*{box-sizing:border-box}html{background:#e6ebf1}body{margin:0;background:#e6ebf1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.58;overflow-x:hidden}.app{width:min(100%,920px);min-height:100vh;margin:auto;background:var(--paper)}.hidden{display:none!important}.welcome{min-height:100vh;max-width:600px;margin:auto;padding:48px 20px 36px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#f7fbff 0%,#fff 72%)}.creator{text-align:center;font-size:12px;color:#6b7280;margin-bottom:22px}.welcome h1{font-size:29px;line-height:1.28;color:var(--navy);margin:8px 0}.welcome p{font-size:17px;color:#4d5d72;margin:0 0 25px}.field{margin:16px 0}.field label{font-size:16px;font-weight:850;display:block;margin-bottom:7px}.field input{width:100%;height:54px;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;color:var(--ink);font-size:17px}.field input:focus{outline:3px solid rgba(254,229,0,.52);border-color:#b79e00}.primary{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--yellow);color:#1f1f1f;font-weight:850;font-size:17px;cursor:pointer}.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 18px 14px;box-shadow:0 2px 10px rgba(15,35,60,.18)}.brand-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand-row small{display:block;font-size:12px;opacity:.78}.brand-row h1{font-size:22px;line-height:1.25;margin:3px 0}.brand-row p{font-size:14px;margin:3px 0 0;opacity:.9}.edit-btn{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;min-height:38px;padding:7px 10px;white-space:nowrap;font-size:13px;font-weight:800;cursor:pointer}.guide{background:var(--yellowSoft);border-bottom:1px solid #eadf8d;color:#5b5000;padding:10px 18px;font-size:14px;font-weight:750}.main{padding:23px 18px 40px;background:var(--bg)}.progress{display:flex;align-items:center;gap:7px;margin-bottom:18px;color:#4b5e75;font-size:13px;font-weight:800}.progress span{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;background:#d9e4ef;color:#4b5e75}.progress span.on{background:var(--green);color:#fff}.progress i{width:20px;height:2px;background:#cbd5e1}.panel{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 2px 8px rgba(24,47,76,.03)}.panel h2{font-size:20px;line-height:1.35;color:var(--navy);margin:0 0 5px}.panel .desc{font-size:14px;color:var(--muted);margin:0 0 13px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category-btn{min-height:72px;border:1px solid #cdd8e5;background:#fff;border-radius:13px;padding:11px;text-align:left;cursor:pointer;font-size:15px;font-weight:850;line-height:1.32;color:var(--ink)}.category-btn.active{background:var(--greenSoft);border-color:#68aa80;color:#0f5d35}.selected-mark{display:block;font-size:11px;color:var(--green);margin-top:3px}.topic-area{margin-top:14px;padding-top:14px;border-top:1px solid #e4eaf1}.topic-title{font-size:15px;font-weight:850;color:#44546a;margin:0 0 9px}.topic-list{display:grid;gap:8px}.topic-btn{width:100%;min-height:53px;border:1px solid #d5dee8;background:#f8fafc;border-radius:11px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;font-size:15px;font-weight:800;line-height:1.35}.topic-btn:hover{background:#f2f7fc}.topic-btn .arrow{color:#55708d;font-size:20px;line-height:1}.trust{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:16px;margin-top:22px}.trust h2{font-size:19px;color:var(--navy);margin:0 0 10px}.trust-list{display:grid;gap:9px}.trust-item{background:#f8fafc;border:1px solid #e3e9f0;border-radius:10px;padding:10px 11px;font-size:14px}.trust-item b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}.footer{padding:18px 20px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#526174;background:#fff;font-size:14px}.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(12,27,46,.58);display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{width:min(100%,660px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 13px 13px;box-shadow:0 -10px 30px rgba(0,0,0,.22);padding:18px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.modal-head h2{font-size:21px;color:var(--navy);line-height:1.32;margin:0}.modal-head p{font-size:13px;color:var(--muted);margin:3px 0 0}.close-btn{width:40px;height:40px;border:0;background:#eef2f6;border-radius:50%;font-size:25px;cursor:pointer}.step-box{border-radius:13px;padding:13px;margin:11px 0}.customer-box{background:#f8fafc;border:1px solid #e0e7ef}.script-box{background:#fff7c8;border:1px solid #ebd979}.ask-box{background:#f8fafc;border:1px solid #e0e7ef}.guide-box{background:var(--greenSoft);border:1px solid #b7ddc4}.warn-box{background:var(--warnSoft);border:1px solid #f0d3a0;color:var(--warn)}.step-num{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:850;margin-right:6px}.step-title{font-size:15px;font-weight:850;color:#526174;vertical-align:middle}.step-box p{font-size:17px;line-height:1.58;white-space:pre-wrap;margin:8px 0 0}.ask-box ol{margin:8px 0 0;padding-left:22px}.ask-box li{margin:5px 0;font-size:16px;line-height:1.45}.warn-box p{font-size:15px;line-height:1.52;white-space:pre-wrap;margin:7px 0 0}.modal-actions{margin-top:15px}.dismiss-btn{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:11px;min-height:53px;font-size:16px;font-weight:800;cursor:pointer}.font-large .panel h2{font-size:24px}.font-large .category-btn,.font-large .topic-btn,.font-large .step-box p,.font-large .ask-box li{font-size:19px}.font-large .trust-item{font-size:17px}@media(max-width:390px){.category-grid{grid-template-columns:1fr}.brand-row h1{font-size:20px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<script>
const STORE={farm:'basicResponseFarmStable',product:'basicResponseProductStable',font:'basicResponseFontStable'};
const DEFAULT_TEXT='고객 상황을 확인한 뒤, 알맞게 안내드리겠습니다.';
const groups=[
 {id:'product',title:'① 어떤 상품이 나에게 맞을까요?',topics:[
  {id:'home',label:'집에서 먹으려고요',customer:'집에서 먹으려고 하는데 어떤 {판매품목}이 괜찮아요?',first:'집에서 드실 거예요?\n드실 분이 몇 분 정도인지 알려주시면 맞는 양으로 추천해 드릴게요.',asks:['몇 분이 드실 예정인가요?','언제 드실 예정인가요?','생각하신 가격대가 있으신가요?'],guide:'가족이 드시기에는 가정용 구성이 편하실 수 있고,\n양이 부담되시면 소포장 구성도 함께 안내드릴게요.',warn:'맛, 품질, 재고, 배송일은\n확인하기 전부터 확정해서 말하지 마세요.'},
  {id:'quality',label:'맛·품질이 궁금해요',customer:'{판매품목}은 맛이 어떤가요? 좋은 걸로 보내 주세요.',first:'맛과 상품 상태를 중요하게 보시는군요.\n오늘 준비된 상품 상태를 확인해서 드시는 용도에 맞게 안내드릴게요.',asks:['바로 드실 예정인가요, 며칠 두고 드실 예정인가요?','크기와 모양, 맛 중에서 어떤 부분을 더 중요하게 보세요?','가정용과 특별한 용도 중 어떤 용도로 보시나요?'],guide:'농산물은 수확 시기와 날씨에 따라 크기나 색이 조금 다를 수 있습니다.\n현재 준비된 상품 상태를 확인해서 안내드릴게요.',warn:'“무조건 맛있어요”처럼 단정하지 말고,\n현재 확인 가능한 상품 상태를 중심으로 안내하세요.'},
  {id:'origin',label:'재배 방법·원산지가 궁금해요',customer:'어디에서 재배했나요? 어떻게 키운 상품인가요?',first:'재배 방법이 궁금하신 거죠?\n어디에서 어떻게 키웠는지 확인 가능한 내용으로 설명드릴게요.',asks:['생산지, 재배 방법, 인증 여부 중 어떤 점이 가장 궁금하신가요?','가족이 드실 상품인지, 특별히 신경 쓰시는 이유가 있으신가요?','보관 방법이나 드시는 방법도 함께 안내해 드릴까요?'],guide:'확인할 수 있는 생산지와 재배·관리 정보를 기준으로 안내드리겠습니다.\n궁금하신 부분을 말씀해 주시면 그 내용부터 확인해 드릴게요.',warn:'재배 방법이나 인증 여부는\n확인되지 않은 내용을 추측해서 말하지 마세요.'},
  {id:'special',label:'특별한 용도로 필요해요',customer:'부모님께 보내려고요. 행사에 가져갈 건데 어떤 구성이 좋을까요?',first:'특별한 용도로 준비하시는군요.\n언제 필요하신지와 몇 분 정도 드실지 알려주시면 맞는 구성을 안내드릴게요.',asks:['언제 필요하신가요?','몇 분이 드시거나 받으시나요?','생각하신 가격대가 있으신가요?'],guide:'포장 방식과 준비 가능한 구성을 확인한 뒤,\n필요한 날짜에 맞출 수 있는지 함께 안내드리겠습니다.',warn:'배송일과 준비 가능 여부는\n출고 일정과 재고를 확인한 뒤 안내하세요.'}
 ]},
 {id:'price',title:'② 가격과 양은 어떻게 되나요?',topics:[
  {id:'price',label:'가격이 궁금해요',customer:'{판매품목}은 얼마예요?',first:'필요하신 양이 어느 정도세요?\n양에 맞춰 금액과 구성을 같이 안내드릴게요.',asks:['몇 분이 드실 예정인가요?','필요한 양은 어느 정도인가요?','생각하신 가격대가 있으신가요?'],guide:'가정용, 소포장, 실속형 등 현재 준비된 구성 중에서\n고객님께 맞는 선택지를 안내드릴게요.',warn:'가격만 먼저 말하기보다\n구성, 중량, 배송비를 함께 확인해 안내하세요.'},
  {id:'small',label:'조금 적은 양은 없나요?',customer:'둘이 먹을 건데 작은 건 없나요?',first:'두 분이 드실 거면 너무 많은 양은 부담스러우실 수 있죠.\n작은 구성이나 드시기 편한 양이 있는지 안내드릴게요.',asks:['두 분이 며칠 정도 드실 예정인가요?','바로 드실 예정인가요, 보관하면서 드실 예정인가요?','양보다 가격을 더 중요하게 보시나요?'],guide:'소포장 구성이 있으면 안내드리고,\n없다면 남기지 않고 드실 수 있는 양을 함께 살펴볼게요.',warn:'없는 소포장 구성을 약속하지 말고,\n현재 가능한 구성부터 확인하세요.'},
  {id:'value',label:'실속형 구성이 있나요?',customer:'모양은 조금 달라도 괜찮으니 실속형이 있나요?',first:'집에서 드실 거면 모양보다 양과 가격이 더 중요하실 수 있죠.\n가정용이나 실속형 구성이 있는지 안내드릴게요.',asks:['모양, 크기, 색 중에서 괜찮으신 부분이 있으신가요?','필요한 양은 어느 정도인가요?','바로 드실 예정인가요, 보관하면서 드실 예정인가요?'],guide:'가정용 또는 실속형은 상품마다 크기나 모양이 조금 다를 수 있습니다.\n현재 가능한 구성과 중량을 확인해서 안내드릴게요.',warn:'실속형의 기준은 상품마다 다를 수 있으므로\n크기·모양·중량을 미리 설명하세요.'},
  {id:'weight',label:'몇 kg 또는 몇 개예요?',customer:'한 상자에 몇 kg이에요? 몇 개 정도 들어 있나요?',first:'구성마다 중량과 개수가 달라질 수 있어요.\n보시는 상품 기준으로 바로 안내드릴게요.',asks:['어떤 구성이나 중량을 보고 계신가요?','몇 분이 드실 예정인가요?','중량과 개수 중 어떤 기준을 더 중요하게 보시나요?'],guide:'판매 단위와 중량을 먼저 확인해 드리고,\n개수는 상품 크기에 따라 달라질 수 있는 점도 함께 안내드릴게요.',warn:'개수는 크기에 따라 달라질 수 있으므로\n중량 기준을 먼저 분명히 안내하세요.'}
 ]},
 {id:'delivery',title:'③ 언제, 어떻게 받을 수 있나요?',topics:[
  {id:'market',label:'오늘 장터에서 살 수 있나요?',customer:'오늘 장터에 나와 계세요? 지금 가면 살 수 있나요?',first:'오늘 나와 있는 상품 중에서 필요한 양을 말씀해 주시면 안내드릴게요.',asks:['몇 시쯤 오실 예정인가요?','필요한 양은 어느 정도인가요?','특정 구성이나 품목을 찾으시나요?'],guide:'장터에 준비된 수량과 구성은 시간대에 따라 달라질 수 있어서,\n오시는 시간과 필요한 상품을 알려주시면 확인해서 안내드릴게요.',warn:'장터 참여 여부와 남은 수량은\n확인하기 전부터 확답하지 마세요.'},
  {id:'ship',label:'언제 출고되나요?',customer:'오늘 주문하면 언제 출고되나요?',first:'택배로 받으실 예정이세요?\n필요하신 날짜를 말씀해 주시면 출고 가능한 일정을 확인해 드릴게요.',asks:['언제 받아보셔야 하나요?','택배로 받으실 예정인가요?','주문하실 구성과 수량은 어느 정도인가요?'],guide:'수확·포장 일정과 현재 주문량을 확인한 뒤,\n가능한 출고 날짜를 안내드리겠습니다.',warn:'출고일은 수확·포장 일정과 주문량을\n확인한 뒤 안내하세요.'},
  {id:'arrival',label:'언제 받을 수 있나요?',customer:'언제 도착하나요?',first:'택배로 받으실 거면 필요하신 날짜를 먼저 말씀해 주세요.\n출고 일정과 배송 가능 날짜를 확인해서 안내드릴게요.',asks:['꼭 받아보셔야 하는 날짜가 있으신가요?','받으시는 지역은 어디인가요?','택배 수령이 가능한 장소인가요?'],guide:'배송 일정은 출고일, 택배 상황, 받으시는 지역에 따라 달라질 수 있습니다.\n확인 후 가능한 날짜를 안내드리겠습니다.',warn:'배송일은 택배 상황에 따라 달라질 수 있으므로\n확인 전부터 확정해서 말하지 마세요.'},
  {id:'fee',label:'배송비는 얼마예요?',customer:'배송비는 얼마예요? 추가 배송비가 있나요?',first:'장터에서 바로 가져가시면 배송비는 없고,\n택배로 받으시면 상품과 지역을 확인해서 안내드릴게요.',asks:['어떤 구성으로 주문하실 예정인가요?','받으시는 지역은 어디인가요?','장터 수령과 택배 수령 중 어떤 방법을 원하시나요?'],guide:'상품 금액과 배송비를 따로 또는 함께 안내하고,\n추가 배송비가 있는 지역은 미리 확인해서 말씀드리겠습니다.',warn:'배송비와 추가 배송비는\n지역과 수령 방법을 확인한 뒤 안내하세요.'}
 ]},
 {id:'repeat',title:'④ 지난번과 비슷할까요?',topics:[
  {id:'same',label:'지난번과 같은 구성이 있나요?',customer:'지난번에 산 구성으로 다시 주문하고 싶어요.',first:'지난번에 드셔 보시고 다시 찾아주셨군요. 감사합니다.\n같은 구성이 있는지 바로 확인해 볼게요.',asks:['지난번과 같은 중량이나 구성을 원하시나요?','이번에도 같은 용도로 드실 예정인가요?','언제 필요하신가요?'],guide:'지난번 구성과 현재 가능한 구성을 비교해서,\n달라진 점이 있으면 함께 안내드리겠습니다.',warn:'지난번과 같은 구성이 항상 가능한 것은 아니므로\n현재 준비 수량을 먼저 확인하세요.'},
  {id:'condition',label:'이번 상품 상태는 어떤가요?',customer:'이번 것도 지난번처럼 괜찮을까요?',first:'지난번에 좋게 드셨다니 감사합니다.\n이번 상품도 지금 상태를 보고 지난번과 다른 점이 있으면 솔직하게 안내드릴게요.',asks:['지난번에 어떤 점이 가장 좋으셨나요?','이번에도 크기, 맛, 양 중에서 어떤 부분을 중요하게 보세요?','같은 구성으로 생각하고 계신가요?'],guide:'이번 상품은 현재 상태를 확인해서 안내드리고,\n지난번과 달라질 수 있는 부분은 미리 말씀드리겠습니다.',warn:'지난번과 완전히 같다고 단정하지 말고\n현재 상품 상태를 확인해 안내하세요.'},
  {id:'difference',label:'지난번과 다른 점이 있나요?',customer:'이번에는 지난번과 뭐가 다른가요?',first:'지난번과 비교해서 보시는군요.\n이번 상품은 달라진 점이 있으면 바로 말씀드릴게요.',asks:['지난번 상품에서 어떤 부분을 가장 좋게 보셨나요?','이번에는 어떤 점이 달라지면 좋겠다고 생각하세요?','같은 양과 구성으로 생각하고 계신가요?'],guide:'수확 시기, 크기, 색, 구성처럼 달라질 수 있는 부분은\n확인 가능한 범위에서 솔직하게 안내드리겠습니다.',warn:'확인되지 않은 품질 차이를 추측하지 말고\n현재 확인 가능한 정보로 설명하세요.'},
  {id:'next',label:'다음 주문은 언제 가능할까요?',customer:'다음 주문은 언제쯤 가능해요?',first:'다음에도 찾아주신다니 감사합니다.\n다음 수확과 준비 일정을 확인해서 주문 가능한 시기를 알려드릴게요.',asks:['언제쯤 필요하신가요?','지난번과 같은 구성으로 생각하고 계신가요?','연락드릴 때 어떤 방법이 편하신가요?'],guide:'수확 시기와 현재 주문 상황에 따라 가능 날짜가 달라질 수 있습니다.\n확인한 뒤 가능한 시기를 안내드리겠습니다.',warn:'다음 주문 가능일은 수확 일정과 준비 수량을\n확인한 뒤 안내하세요.'}
 ]}
];
let state={farm:safeGet(STORE.farm),product:safeGet(STORE.product),groupId:'product',topicId:'home'};
let fontLarge=safeGet(STORE.font)==='large';
const app=document.getElementById('app');const modalRoot=document.getElementById('modalRoot');
function safeGet(key){try{return localStorage.getItem(key)||''}catch(e){return ''}}
function safeSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}
function safeRemove(key){try{localStorage.removeItem(key)}catch(e){}}
function esc(value){return String(value??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function fill(value){return String(value??DEFAULT_TEXT).replaceAll('{농장이름}',state.farm||'내 농장').replaceAll('{판매품목}',state.product||'판매 품목')}
function validGroup(){return groups.find(g=>g.id===state.groupId)||groups[0]}
function validTopic(){const g=validGroup();return g.topics.find(t=>t.id===state.topicId)||g.topics[0]}
function textOf(value,fallback=DEFAULT_TEXT){const result=fill(value);return result&&result!=='undefined'&&result!=='null'?result:fallback}
function applyFont(){app.classList.toggle('font-large',fontLarge)}
function render(){applyFont();if(!state.farm||!state.product){renderStart();return}const g=validGroup();if(g.id!==state.groupId)state.groupId=g.id;const t=validTopic();if(t.id!==state.topicId)state.topicId=t.id;renderMain()}
function renderStart(){modalRoot.innerHTML='';app.innerHTML=`<main class="welcome"><div class="creator">Created by 커리어인 박은미 대표</div><h1>청년 농업인<br>기본 고객응대 스크립트</h1><p>직거래 고객에게 바로 말해 볼 수 있는<br>기본 고객응대 문장을 연습해 보세요.</p><div class="field"><label for="farm">농장 이름</label><input id="farm" maxlength="20" placeholder="예: 햇살농장" value="${esc(state.farm)}"></div><div class="field"><label for="product">대표 판매 품목</label><input id="product" maxlength="30" placeholder="예: 설향 딸기" value="${esc(state.product)}"></div><button class="primary" type="button" onclick="saveFarm()">고객응대 시작하기</button></main>`}
function saveFarm(){const farm=document.getElementById('farm');const product=document.getElementById('product');const f=farm?farm.value.trim():'';const p=product?product.value.trim():'';if(!f){alert('농장 이름을 적어 주세요.');farm?.focus();return}if(!p){alert('대표 판매 품목을 적어 주세요.');product?.focus();return}state.farm=f;state.product=p;safeSet(STORE.farm,f);safeSet(STORE.product,p);render()}
function renderMain(){const g=validGroup();app.innerHTML=`<header class="topbar"><div class="brand-row"><div><small>Created by 커리어인 박은미 대표</small><h1>${esc(state.farm)} 맞춤 고객응대</h1><p>대표 판매 품목: ${esc(state.product)}</p></div><button class="edit-btn" type="button" onclick="editFarm()">농장 정보 수정</button></div></header><div class="guide">고객의 질문을 반갑게 받고, 필요한 내용을 확인한 뒤 맞춰 안내해 보세요.</div><main class="main"><div class="progress" aria-label="사용 순서"><span class="on">1</span><i></i><span class="on">2</span><i></i><span>3</span><b>고객 질문 선택 → 세부 상황 선택 → 스크립트 연습</b></div><section class="panel"><h2>1. 고객이 무엇을 궁금해하나요?</h2><p class="desc">고객의 말과 가장 가까운 카테고리를 먼저 눌러 보세요.</p><div class="category-grid">${groups.map(group=>`<button class="category-btn ${state.groupId===group.id?'active':''}" type="button" onclick="chooseGroup('${group.id}')">${esc(group.title)}${state.groupId===group.id?'<span class="selected-mark">선택됨</span>':''}</button>`).join('')}</div><div class="topic-area"><p class="topic-title">2. 고객 상황을 하나 골라 보세요.</p><div class="topic-list">${g.topics.map(topic=>`<button class="topic-btn" type="button" onclick="openModal('${topic.id}')"><span>${esc(topic.label)}</span><span class="arrow" aria-hidden="true">›</span></button>`).join('')}</div></div></section><section class="trust"><h2>고객 신뢰를 위한 4가지 확인 문장</h2><div class="trust-list"><div class="trust-item"><b>1. 상품·구성 확인</b>상품명, 구성, 중량을 다시 확인해 드릴게요.</div><div class="trust-item"><b>2. 금액·배송비 확인</b>총금액과 배송비를 함께 안내드리겠습니다.</div><div class="trust-item"><b>3. 배송 일정 확인</b>출고 가능일과 배송 예정일을 확인한 뒤 안내드릴게요.</div><div class="trust-item"><b>4. 주문 내용 문자 확인</b>주문 내용은 카카오톡이나 문자로 다시 정리해 드릴게요.</div></div></section></main><footer class="footer">좋은 판매 대화는 상품을 많이 설명하는 것에서 시작하지 않습니다.<br>고객이 왜 필요하고, 언제 필요하고, 어느 정도 필요한지 먼저 묻는 것에서 시작합니다.<br><button class="edit-btn" style="margin-top:12px;background:#fff;color:#153258;border-color:#cbd5e1" type="button" onclick="toggleFont()">글자 ${fontLarge?'기본':'크게'} 보기</button></footer>`}
function chooseGroup(id){const next=groups.find(g=>g.id===id)||groups[0];state.groupId=next.id;state.topicId=next.topics[0].id;render()}
function openModal(id){const g=validGroup();const next=g.topics.find(t=>t.id===id)||g.topics[0];state.topicId=next.id;buildModal()}
function buildModal(){const g=validGroup();const t=validTopic();const customer=textOf(t.customer,'고객의 문의 내용을 확인해 보세요.');const first=textOf(t.first);const guide=textOf(t.guide);const warn=textOf(t.warn,'확인되지 않은 내용은 바로 확정해서 말하지 마세요.');const asks=Array.isArray(t.asks)&&t.asks.length?t.asks:[DEFAULT_TEXT];modalRoot.innerHTML=`<div class="modal-backdrop" onclick="backdropClose(event)"><div class="modal" role="dialog" aria-modal="true" aria-label="고객응대 스크립트" onclick="event.stopPropagation()"><div class="modal-head"><div><h2>${esc(g.title)}</h2><p>${esc(t.label)}</p></div><button class="close-btn" type="button" aria-label="스크립트 팝업 닫기" onclick="closeModal()">×</button></div><div class="step-box customer-box"><span class="step-num">1</span><span class="step-title">고객 상황</span><p>“${esc(customer)}”</p></div><div class="step-box script-box"><span class="step-num">2</span><span class="step-title">관계 여는 첫마디</span><p>${esc(first)}</p></div><div class="step-box ask-box"><span class="step-num">3</span><span class="step-title">꼭 물어볼 것</span><ol>${asks.slice(0,3).map(item=>`<li>${esc(textOf(item))}</li>`).join('')}</ol></div><div class="step-box guide-box"><span class="step-num">4</span><span class="step-title">맞춤 안내와 다음 대화</span><p>${esc(guide)}</p></div><div class="step-box warn-box"><span class="step-title">⚠️ 핵심 주의사항</span><p>${esc(warn)}</p></div><div class="modal-actions"><button class="dismiss-btn" type="button" onclick="closeModal()">닫기</button></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}function backdropClose(event){if(event.target===event.currentTarget)closeModal()}function editFarm(){state.farm='';state.product='';safeRemove(STORE.farm);safeRemove(STORE.product);render()}function toggleFont(){fontLarge=!fontLarge;safeSet(STORE.font,fontLarge?'large':'default');render()}
render();
</script>
</body>
</html>
