<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청년 농업인 클레임 고객응대 스크립트</title>
<style>
:root{--navy:#153258;--navy2:#274f7e;--ink:#1e2938;--muted:#64748b;--line:#d9e1ea;--bg:#f3f7fb;--paper:#fff;--yellow:#fee500;--yellowSoft:#fff8cc;--green:#11663d;--greenSoft:#e8f6ed;--warn:#8b4b00;--warnSoft:#fff4df;--danger:#9c2f26;--dangerSoft:#fff0ee;--shadow:0 8px 22px rgba(24,47,76,.10)}
*{box-sizing:border-box}html{background:#e6ebf1}body{margin:0;background:#e6ebf1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.58;overflow-x:hidden}.app{width:min(100%,920px);min-height:100vh;margin:auto;background:var(--paper)}.welcome{min-height:100vh;max-width:600px;margin:auto;padding:48px 20px 36px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#f7fbff 0%,#fff 72%)}.creator{text-align:center;font-size:12px;color:#6b7280;margin-bottom:22px}.welcome h1{font-size:29px;line-height:1.28;color:var(--navy);margin:8px 0}.welcome p{font-size:17px;color:#4d5d72;margin:0 0 25px}.field{margin:16px 0}.field label{font-size:16px;font-weight:850;display:block;margin-bottom:7px}.field input{width:100%;height:54px;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;color:var(--ink);font-size:17px}.field input:focus{outline:3px solid rgba(254,229,0,.52);border-color:#b79e00}.primary{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--yellow);color:#1f1f1f;font-weight:850;font-size:17px;cursor:pointer}.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 18px 14px;box-shadow:0 2px 10px rgba(15,35,60,.18)}.brand-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand-row small{display:block;font-size:12px;opacity:.78}.brand-row h1{font-size:22px;line-height:1.25;margin:3px 0}.brand-row p{font-size:14px;margin:3px 0 0;opacity:.9}.edit-btn{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;min-height:38px;padding:7px 10px;white-space:nowrap;font-size:13px;font-weight:800;cursor:pointer}.guide{background:var(--yellowSoft);border-bottom:1px solid #eadf8d;color:#5b5000;padding:10px 18px;font-size:14px;font-weight:750}.main{padding:23px 18px 40px;background:var(--bg)}.progress{display:flex;align-items:center;gap:7px;margin-bottom:18px;color:#4b5e75;font-size:13px;font-weight:800}.progress span{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;background:#d9e4ef;color:#4b5e75}.progress span.on{background:var(--green);color:#fff}.progress i{width:20px;height:2px;background:#cbd5e1}.panel{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 2px 8px rgba(24,47,76,.03)}.panel h2{font-size:20px;line-height:1.35;color:var(--navy);margin:0 0 5px}.panel .desc{font-size:14px;color:var(--muted);margin:0 0 13px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category-btn{min-height:72px;border:1px solid #cdd8e5;background:#fff;border-radius:13px;padding:11px;text-align:left;cursor:pointer;font-size:15px;font-weight:850;line-height:1.32;color:var(--ink)}.category-btn.active{background:var(--greenSoft);border-color:#68aa80;color:#0f5d35}.category-btn.safety{border-color:#e7b3a9;background:#fff9f8}.category-btn.safety.active{background:#fff0ee;border-color:#d98578;color:var(--danger)}.selected-mark{display:block;font-size:11px;color:var(--green);margin-top:3px}.category-btn.safety.active .selected-mark{color:var(--danger)}.topic-area{margin-top:14px;padding-top:14px;border-top:1px solid #e4eaf1}.topic-title{font-size:15px;font-weight:850;color:#44546a;margin:0 0 9px}.topic-list{display:grid;gap:8px}.topic-btn{width:100%;min-height:53px;border:1px solid #d5dee8;background:#f8fafc;border-radius:11px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;font-size:15px;font-weight:800;line-height:1.35}.topic-btn:hover{background:#f2f7fc}.topic-btn .arrow{color:#55708d;font-size:20px;line-height:1}.trust{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:16px;margin-top:22px}.trust h2{font-size:19px;color:var(--navy);margin:0 0 10px}.trust-list{display:grid;gap:9px}.trust-item{background:#f8fafc;border:1px solid #e3e9f0;border-radius:10px;padding:10px 11px;font-size:14px}.trust-item b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}.footer{padding:18px 20px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#526174;background:#fff;font-size:14px}.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(12,27,46,.58);display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{width:min(100%,660px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 13px 13px;box-shadow:0 -10px 30px rgba(0,0,0,.22);padding:18px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.modal-head h2{font-size:21px;color:var(--navy);line-height:1.32;margin:0}.modal-head p{font-size:13px;color:var(--muted);margin:3px 0 0}.close-btn{width:40px;height:40px;border:0;background:#eef2f6;border-radius:50%;font-size:25px;cursor:pointer}.step-box{border-radius:13px;padding:13px;margin:11px 0}.customer-box{background:#f8fafc;border:1px solid #e0e7ef}.script-box{background:#fff7c8;border:1px solid #ebd979}.ask-box{background:#f8fafc;border:1px solid #e0e7ef}.guide-box{background:var(--greenSoft);border:1px solid #b7ddc4}.warn-box{background:var(--warnSoft);border:1px solid #f0d3a0;color:var(--warn)}.safety-box{background:var(--dangerSoft);border:1px solid #efbeb8;color:var(--danger)}.step-num{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:850;margin-right:6px}.safety-box .step-num{background:var(--danger)}.step-title{font-size:15px;font-weight:850;color:#526174;vertical-align:middle}.safety-box .step-title{color:var(--danger)}.step-box p{font-size:17px;line-height:1.58;white-space:pre-wrap;margin:8px 0 0}.ask-box ol{margin:8px 0 0;padding-left:22px}.ask-box li{margin:5px 0;font-size:16px;line-height:1.45}.warn-box p,.safety-box p{font-size:15px;line-height:1.52;white-space:pre-wrap;margin:7px 0 0}.modal-actions{margin-top:15px}.dismiss-btn{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:11px;min-height:53px;font-size:16px;font-weight:800;cursor:pointer}.font-large .panel h2{font-size:24px}.font-large .category-btn,.font-large .topic-btn,.font-large .step-box p,.font-large .ask-box li{font-size:19px}.font-large .trust-item{font-size:17px}@media(max-width:390px){.category-grid{grid-template-columns:1fr}.brand-row h1{font-size:20px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<script>
const STORE={farm:'claimResponseFarmStable',product:'claimResponseProductStable',font:'claimResponseFontStable'};
const DEFAULT_TEXT='고객 상황을 확인한 뒤, 알맞게 안내드리겠습니다.';
const groups=[
 {id:'delivery',title:'① 배송·수령에 문제가 있어요',topics:[
  {id:'delay',label:'배송이 늦어요',customer:'주문한 {판매품목}이 아직 도착하지 않았어요. 언제 받을 수 있나요?',first:'기다리게 해 드려 죄송합니다.\n제가 배송 상황을 바로 확인해 보겠습니다.',asks:['주문하신 분 성함이나 주문번호를 알려주실 수 있을까요?','꼭 받아보셔야 하는 날짜가 있으신가요?','받으시는 지역을 다시 확인해도 될까요?'],guide:'배송 위치와 출고 내용을 확인한 뒤,\n지킬 수 있는 시간으로 가능한 일정과 방법을 다시 안내드리겠습니다.',warn:'배송 상황을 확인하기 전에는\n도착 시간을 확정해서 말하지 마세요.'},
  {id:'shipping',label:'배송비가 다르거나 추가 비용이 있어요',customer:'배송비가 생각한 것과 다르거나 추가 비용이 있다고 하네요.',first:'배송비 때문에 혼란을 드려 죄송합니다.\n주문 내용과 받으시는 지역을 먼저 확인해 보겠습니다.',asks:['주문하신 구성과 수량을 알려주실 수 있을까요?','받으시는 지역은 어디인가요?','안내받으신 배송비나 추가 비용이 얼마인지 알려주실 수 있을까요?'],guide:'상품 금액, 배송비, 추가 배송비 여부를 확인한 뒤\n정확한 내용을 다시 안내드리겠습니다.',warn:'배송비와 추가 비용은\n지역과 수령 방법을 확인한 뒤 안내하세요.'},
  {id:'missed',label:'수령 방법이 헷갈려요',customer:'장터에서 받을 수 있는지, 택배로 받아야 하는지 헷갈려요.',first:'수령 방법이 헷갈리실 수 있습니다.\n고객님께 편한 방법을 먼저 확인해 보겠습니다.',asks:['장터에서 직접 받아보시기 편하신가요?','택배로 받으시면 꼭 필요한 날짜가 있으신가요?','받으시는 지역은 어디인가요?'],guide:'장터 수령과 택배 수령 중 가능한 방법을 확인해서\n고객님께 편한 방법으로 안내드리겠습니다.',warn:'장터 참여 여부와 택배 가능일은\n확인하기 전부터 확답하지 마세요.'}
 ]},
 {id:'condition',title:'② 상품 상태가 아쉬워요',topics:[
  {id:'bruised',label:'무르거나 멍든 상품이 있어요',customer:'받아 본 {판매품목} 중 일부가 무르거나 멍든 것 같아요.',first:'받아보신 {판매품목} 상태가 기대와 달라 많이 속상하셨겠습니다.',asks:['상품을 받으신 날짜를 알려주실 수 있을까요?','상품 전체와 문제가 보이는 부분 사진을 남겨 주실 수 있을까요?','문제가 있는 상품이 어느 정도인지 알려주실 수 있을까요?'],guide:'정확히 확인하고 빠르게 도와드리기 위해\n사진과 주문 내용을 확인한 뒤 처리 방향을 안내드리겠습니다.',warn:'“농산물은 원래 그럴 수 있어요”라고 먼저 말하지 말고\n고객이 받은 상품 상태를 먼저 확인하세요.'},
  {id:'storage',label:'보관 방법이 궁금해요',customer:'상품을 어떻게 보관해야 하나요? 상태가 달라질까 걱정돼요.',first:'보관 방법이 궁금하셨군요.\n상품 상태에 맞는 방법으로 안내드리겠습니다.',asks:['상품을 받으신 날짜가 언제인가요?','바로 드실 예정인가요, 며칠 보관하실 예정인가요?','현재 보관하고 계신 장소를 알려주실 수 있을까요?'],guide:'{판매품목}의 현재 상태와 드시는 시기를 확인해서\n보관 방법을 알기 쉽게 안내드리겠습니다.',warn:'품목별 보관 방법이 다를 수 있으므로\n확인하지 않은 보관 방법을 단정해서 안내하지 마세요.'},
  {id:'damage',label:'포장이 찌그러지거나 파손됐어요',customer:'상자가 찌그러졌고 포장도 일부 파손된 것 같아요.',first:'포장 상태 때문에 불편을 드려 죄송합니다.\n받으신 상태를 확인해 보겠습니다.',asks:['박스 전체와 송장이 보이게 사진을 남겨 주실 수 있을까요?','상품 안쪽 상태도 함께 확인해 주실 수 있을까요?','상품을 받으신 날짜를 알려주실 수 있을까요?'],guide:'포장과 상품 상태를 함께 확인한 뒤\n고객님께 불편이 적은 처리 방향을 안내드리겠습니다.',warn:'포장 파손만 보고 상품 상태를 추측하지 말고\n상품 안쪽 상태까지 함께 확인하세요.'}
 ]},
 {id:'order',title:'③ 주문 내용이 달라요',topics:[
  {id:'wrong',label:'다른 상품이나 구성이 왔어요',customer:'제가 주문한 {판매품목}과 다른 상품이나 구성이 온 것 같아요.',first:'주문하신 내용과 다르게 받아보셨다면 많이 당황하셨겠습니다.\n제가 주문 내용과 출고 내용을 바로 확인해 보겠습니다.',asks:['주문하신 분 성함이나 주문번호를 알려주실 수 있을까요?','받으신 상품과 라벨이 보이게 사진을 남겨 주실 수 있을까요?','주문하신 구성과 다른 부분을 알려주실 수 있을까요?'],guide:'주문 내역과 출고 내용을 확인한 뒤\n차이가 있으면 고객님께 불편이 적은 방법을 안내드리겠습니다.',warn:'누구의 잘못인지 먼저 따지기보다\n주문 내역과 실제 받은 상품을 먼저 확인하세요.'},
  {id:'quantity',label:'수량이나 중량이 달라요',customer:'주문한 양보다 적게 온 것 같아요.',first:'주문하신 양보다 적게 느껴지셨다면 많이 아쉬우셨겠습니다.\n확인해서 안내드리겠습니다.',asks:['주문하신 구성과 수량을 알려주실 수 있을까요?','박스 전체와 송장, 상품 사진을 남겨 주실 수 있을까요?','가능하시면 실제 중량이나 수량도 알려주실 수 있을까요?'],guide:'주문 내용과 출고 내용을 확인하고,\n차이가 확인되면 처리 방향을 안내드리겠습니다.',warn:'개수는 상품 크기에 따라 달라질 수 있으므로\n중량과 주문 기준을 함께 확인하세요.'},
  {id:'option',label:'주문 옵션과 달라요',customer:'가정용으로 주문했는데 생각한 옵션과 다른 것 같아요.',first:'주문하신 옵션과 다르게 느껴지셨다면 혼란스러우셨겠습니다.\n주문 내용을 확인해 보겠습니다.',asks:['주문하신 옵션이나 구성을 알려주실 수 있을까요?','받으신 상품 전체와 라벨 사진을 남겨 주실 수 있을까요?','어떤 부분이 다르게 느껴지셨는지 알려주실 수 있을까요?'],guide:'주문하신 옵션, 사전 안내 내용, 출고 내용을 함께 확인한 뒤\n처리 방향을 안내드리겠습니다.',warn:'고객이 주문을 잘못했다고 단정하지 말고\n주문 기록과 출고 기록을 함께 확인하세요.'}
 ]},
 {id:'expectation',title:'④ 기대한 모습과 달라요',topics:[
  {id:'size',label:'사진보다 작거나 모양이 달라요',customer:'사진보다 작아 보이거나 모양이 다른 것 같아요.',first:'기대하신 모습과 다르게 느껴지셨다면 많이 아쉬우셨겠습니다.\n말씀 주신 내용을 확인해 보겠습니다.',asks:['크기, 색, 모양 중 어떤 부분이 가장 아쉬우셨나요?','받으신 상품 전체와 아쉬운 부분 사진을 남겨 주실 수 있을까요?','주문하신 옵션을 알려주실 수 있을까요?'],guide:'주문하신 옵션과 사전에 안내드린 기준,\n받으신 상품 상태를 함께 확인한 뒤 안내드리겠습니다.',warn:'농산물은 자연물이라 차이가 있을 수 있지만\n고객의 기대와 안내 내용이 달랐는지는 확인해야 합니다.'},
  {id:'gift',label:'특별한 용도에 맞지 않아요',customer:'특별한 용도로 준비했는데 생각보다 아쉬워요.',first:'특별한 용도로 준비하셨는데 기대와 달라 많이 아쉬우셨겠습니다.',asks:['언제, 어떤 용도로 준비하셨는지 알려주실 수 있을까요?','가장 아쉬운 부분이 무엇인지 알려주실 수 있을까요?','상품 전체와 아쉬운 부분 사진을 남겨 주실 수 있을까요?'],guide:'주문 목적과 선택하신 구성, 상품 상태를 함께 확인해서\n가능한 처리 방향을 안내드리겠습니다.',warn:'특별한 용도라고 해서 확인 전부터\n환불이나 재발송을 바로 약속하지 마세요.'},
  {id:'description',label:'상세 안내와 다르게 느껴져요',customer:'안내된 내용과 실제 받은 상품이 다른 것 같아요.',first:'안내 내용과 다르게 느껴지셨다면 혼란스러우셨겠습니다.\n주문 내용과 안내 기준을 확인해 보겠습니다.',asks:['어떤 안내 내용과 다르게 느끼셨는지 알려주실 수 있을까요?','주문하신 옵션을 알려주실 수 있을까요?','받으신 상품 사진을 남겨 주실 수 있을까요?'],guide:'주문 옵션과 사전 안내 내용, 실제 상품 상태를 함께 확인한 뒤\n처리 방향을 안내드리겠습니다.',warn:'상세 안내와 실제 상품의 차이는\n사진과 주문 옵션을 함께 확인한 뒤 판단하세요.'}
 ]},
 {id:'safety',title:'⑤ 바로 확인이 필요해요',safety:true,topics:[
  {id:'foreign',label:'이물질이 나왔어요',customer:'{판매품목}에서 이물질이 나왔어요.',first:'많이 놀라셨겠습니다.\n우선 해당 상품은 드시지 말고 보관해 주세요.',asks:['상품과 포장, 문제 부분이 보이게 사진을 남겨 주실 수 있을까요?','상품을 받으신 날짜를 알려주실 수 있을까요?','남은 상품은 보관하고 계신가요?'],guide:'수령 정보와 상품 상태를 바로 확인한 뒤\n필요한 처리 방향을 안내드리겠습니다.',warn:'이물질 관련 상황은 일반 불만처럼 가볍게 처리하지 말고\n상품과 포장을 보관하도록 먼저 안내하세요.',safety:true},
  {id:'illness',label:'먹고 몸이 불편해요',customer:'먹고 나서 몸이 불편한 것 같아요.',first:'몸이 불편하시다니 많이 걱정되셨겠습니다.\n우선 남은 상품은 드시지 말고 보관해 주세요.',asks:['어떤 증상이 있으신지 알려주실 수 있을까요?','상품을 받으신 날짜와 드신 시간을 알려주실 수 있을까요?','상품과 포장, 문제 부분 사진을 남겨 주실 수 있을까요?'],guide:'제가 바로 확인하겠습니다.\n몸이 불편하시면 우선 의료기관 진료를 받아 주세요.',warn:'몸 이상은 원인을 추측하거나 가볍게 말하지 말고\n진료 안내와 상품·포장 보관을 우선하세요.',safety:true},
  {id:'severe',label:'심하게 변질된 것 같아요',customer:'상품이 심하게 변질된 것 같아요.',first:'상품 상태 때문에 많이 놀라셨겠습니다.\n우선 드시지 말고 상품을 보관해 주세요.',asks:['상품 전체와 문제가 보이는 부분 사진을 남겨 주실 수 있을까요?','상품을 받으신 날짜를 알려주실 수 있을까요?','보관하신 장소와 상태를 알려주실 수 있을까요?'],guide:'상품 상태와 수령 정보를 바로 확인한 뒤\n필요한 처리 방향을 안내드리겠습니다.',warn:'심한 변질 의심 상황은 일반 품질 불만처럼 처리하지 말고\n섭취 중단과 상품 보관을 먼저 안내하세요.',safety:true}
 ]}
];
let state={farm:safeGet(STORE.farm),product:safeGet(STORE.product),groupId:'delivery',topicId:'delay'};let fontLarge=safeGet(STORE.font)==='large';
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot');
function safeGet(key){try{return localStorage.getItem(key)||''}catch(e){return ''}}function safeSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}function safeRemove(key){try{localStorage.removeItem(key)}catch(e){}}
function esc(value){return String(value??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function fill(value){return String(value??DEFAULT_TEXT).replaceAll('{농장이름}',state.farm||'내 농장').replaceAll('{판매품목}',state.product||'판매 품목')}
function validGroup(){return groups.find(g=>g.id===state.groupId)||groups[0]}function validTopic(){const g=validGroup();return g.topics.find(t=>t.id===state.topicId)||g.topics[0]}function textOf(value,fallback=DEFAULT_TEXT){const result=fill(value);return result&&result!=='undefined'&&result!=='null'?result:fallback}function applyFont(){app.classList.toggle('font-large',fontLarge)}
function render(){applyFont();if(!state.farm||!state.product){renderStart();return}const g=validGroup();state.groupId=g.id;const t=validTopic();state.topicId=t.id;renderMain()}
function renderStart(){modalRoot.innerHTML='';app.innerHTML=`<main class="welcome"><div class="creator">Created by 커리어인 박은미 대표</div><h1>청년 농업인<br>클레임 고객응대 스크립트</h1><p>고객 불만 상황에서 먼저 무엇을 말하고<br>무엇을 확인해야 하는지 연습해 보세요.</p><div class="field"><label for="farm">농장 이름</label><input id="farm" maxlength="20" placeholder="예: 햇살농장" value="${esc(state.farm)}"></div><div class="field"><label for="product">대표 판매 품목</label><input id="product" maxlength="30" placeholder="예: 설향 딸기" value="${esc(state.product)}"></div><button class="primary" type="button" onclick="saveFarm()">클레임 응대 시작하기</button></main>`}
function saveFarm(){const farm=document.getElementById('farm'),product=document.getElementById('product');const f=farm?farm.value.trim():'';const p=product?product.value.trim():'';if(!f){alert('농장 이름을 적어 주세요.');farm?.focus();return}if(!p){alert('대표 판매 품목을 적어 주세요.');product?.focus();return}state.farm=f;state.product=p;safeSet(STORE.farm,f);safeSet(STORE.product,p);render()}
function renderMain(){const g=validGroup();app.innerHTML=`<header class="topbar"><div class="brand-row"><div><small>Created by 커리어인 박은미 대표</small><h1>${esc(state.farm)} 맞춤 클레임 응대</h1><p>대표 판매 품목: ${esc(state.product)}</p></div><button class="edit-btn" type="button" onclick="editFarm()">농장 정보 수정</button></div></header><div class="guide">고객의 불편을 먼저 알아주고, 필요한 내용을 확인한 뒤 처리 방향을 안내해 보세요.</div><main class="main"><div class="progress"><span class="on">1</span><i></i><span class="on">2</span><i></i><span>3</span><b>클레임 유형 선택 → 세부 상황 선택 → 스크립트 연습</b></div><section class="panel"><h2>1. 고객이 어떤 불편을 말씀하셨나요?</h2><p class="desc">고객의 말과 가장 가까운 클레임 유형을 먼저 눌러 보세요.</p><div class="category-grid">${groups.map(group=>`<button class="category-btn ${group.safety?'safety':''} ${state.groupId===group.id?'active':''}" type="button" onclick="chooseGroup('${group.id}')">${esc(group.title)}${state.groupId===group.id?'<span class="selected-mark">선택됨</span>':''}</button>`).join('')}</div><div class="topic-area"><p class="topic-title">2. 세부 상황을 하나 골라 보세요.</p><div class="topic-list">${g.topics.map(topic=>`<button class="topic-btn" type="button" onclick="openModal('${topic.id}')"><span>${esc(topic.label)}</span><span class="arrow" aria-hidden="true">›</span></button>`).join('')}</div></div></section><section class="trust"><h2>고객 신뢰를 위한 4가지 응대 원칙</h2><div class="trust-list"><div class="trust-item"><b>1. 먼저 불편을 알아주기</b>고객이 기다렸거나 속상했던 마음을 먼저 받아줍니다.</div><div class="trust-item"><b>2. 필요한 내용 확인하기</b>주문 정보, 사진, 수령일 등 필요한 내용만 확인합니다.</div><div class="trust-item"><b>3. 처리 방향 안내하기</b>확인 전 확정하지 말고, 가능한 방향을 안내합니다.</div><div class="trust-item"><b>4. 다시 연락할 시간 말하기</b>지킬 수 있는 시간으로 다시 안내하겠다고 말합니다.</div></div></section></main><footer class="footer">클레임은 감정 싸움이 아니라, 고객의 불편을 확인하고 신뢰를 회복하는 과정입니다.<br><button class="edit-btn" style="margin-top:12px;background:#fff;color:#153258;border-color:#cbd5e1" type="button" onclick="toggleFont()">글자 ${fontLarge?'기본':'크게'} 보기</button></footer>`}
function chooseGroup(id){const next=groups.find(g=>g.id===id)||groups[0];state.groupId=next.id;state.topicId=next.topics[0].id;render()}function openModal(id){const g=validGroup();const next=g.topics.find(t=>t.id===id)||g.topics[0];state.topicId=next.id;buildModal()}
function buildModal(){const g=validGroup(),t=validTopic();const customer=textOf(t.customer,'고객의 불편 내용을 확인해 보세요.');const first=textOf(t.first);const guide=textOf(t.guide);const warn=textOf(t.warn,'확인되지 않은 내용은 바로 확정해서 말하지 마세요.');const asks=Array.isArray(t.asks)&&t.asks.length?t.asks:[DEFAULT_TEXT];const safety=Boolean(g.safety||t.safety);modalRoot.innerHTML=`<div class="modal-backdrop" onclick="backdropClose(event)"><div class="modal" role="dialog" aria-modal="true" aria-label="클레임 고객응대 스크립트" onclick="event.stopPropagation()"><div class="modal-head"><div><h2>${esc(g.title)}</h2><p>${esc(t.label)}</p></div><button class="close-btn" type="button" aria-label="스크립트 팝업 닫기" onclick="closeModal()">×</button></div><div class="step-box customer-box"><span class="step-num">1</span><span class="step-title">고객 상황</span><p>“${esc(customer)}”</p></div><div class="step-box script-box"><span class="step-num">2</span><span class="step-title">마음 먼저 알아주기</span><p>${esc(first)}</p></div><div class="step-box ask-box"><span class="step-num">3</span><span class="step-title">꼭 확인할 것</span><ol>${asks.slice(0,3).map(item=>`<li>${esc(textOf(item))}</li>`).join('')}</ol></div><div class="step-box guide-box"><span class="step-num">4</span><span class="step-title">처리 방향과 다음 안내</span><p>${esc(guide)}\n\n확인한 뒤 지킬 수 있는 시간으로 다시 안내드리겠습니다.</p></div>${safety?`<div class="step-box safety-box"><span class="step-title">🚨 안전 관련 우선 안내</span><p>우선 해당 상품은 드시지 말고 보관해 주세요.\n몸이 불편하시면 우선 의료기관 진료를 받아 주세요.</p></div>`:''}<div class="step-box warn-box"><span class="step-title">⚠️ 핵심 주의사항</span><p>${esc(warn)}</p></div><div class="modal-actions"><button class="dismiss-btn" type="button" onclick="closeModal()">닫기</button></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}function backdropClose(event){if(event.target===event.currentTarget)closeModal()}function editFarm(){state.farm='';state.product='';safeRemove(STORE.farm);safeRemove(STORE.product);render()}function toggleFont(){fontLarge=!fontLarge;safeSet(STORE.font,fontLarge?'large':'default');render()}
render();
</script>
</body>
